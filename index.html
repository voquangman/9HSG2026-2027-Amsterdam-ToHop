    /* DANH SÁCH ENUMERATE PHÂN CẤP TỰ ĐỘNG (a), b) -> 1., 2. -> i), ii)) */
    #slide-question ul, #slide-solution ul, .extest-box ul, #interactive-area ul {
      list-style-type: disc !important;
      margin-left: 1.5rem !important;
      margin-top: 0.5rem !important;
      margin-bottom: 0.5rem !important;

    #slide-question ul ul, #slide-solution ul ul, .extest-box ul ul, #interactive-area ul ul {
      list-style-type: circle !important;
    }

    #slide-question ol, #slide-solution ol, .extest-box ol, #interactive-area ol {
      list-style: none !important;
      counter-reset: enum-level1;
      padding-left: 0 !important;
      margin-left: 0.25rem !important;
      margin-top: 0.5rem !important;
      margin-bottom: 0.5rem !important;
    }
    #slide-question ol > li, #slide-solution ol > li, .extest-box ol > li, #interactive-area ol > li {
      counter-increment: enum-level1;
      position: relative;
      padding-left: 2.2rem !important;
      margin-top: 0.35rem !important;
      margin-bottom: 0.35rem !important;
      line-height: 1.6 !important;
    }
    #slide-question ol > li::before, #slide-solution ol > li::before, .extest-box ol > li::before, #interactive-area ol > li::before {
      content: counter(enum-level1, lower-alpha) ")";
      font-weight: 800;
      color: var(--math-color);
      position: absolute;
      left: 0.25rem;
      top: 0;
    }

    #slide-question ol ol, #slide-solution ol ol, .extest-box ol ol, #interactive-area ol ol {
      list-style: none !important;
      counter-reset: enum-level2;
      margin-left: 0.25rem !important;
      margin-top: 0.4rem !important;
      margin-bottom: 0.4rem !important;
    }
    #slide-question ol ol > li, #slide-solution ol ol > li, .extest-box ol ol > li, #interactive-area ol ol > li {
      counter-increment: enum-level2;
      position: relative;
      padding-left: 2rem !important;
      margin-top: 0.25rem !important;
      margin-bottom: 0.25rem !important;
    }
    #slide-question ol ol > li::before, #slide-solution ol ol > li::before, .extest-box ol ol > li::before, #interactive-area ol ol > li::before {
      content: counter(enum-level2, decimal) ".";
      font-weight: 700;
      color: var(--text-main);
      position: absolute;
      left: 0.25rem;
      top: 0;
    }

    /* STYLES MÔI TRƯỜNG EX_TEST & IMMINI */

    .tikz-container svg { max-width: 100%; height: auto; border-radius: 8px; background: #fff; padding: 6px; }

<body class="h-screen w-screen flex flex-col justify-between" data-theme="cyber">

  <!-- TOPBAR HEADER PROMAX RESPONSIVE -->
  <header class="glass-card border-b px-3 sm:px-4 py-2.5 flex items-center justify-between shrink-0 gap-2 z-40">
    <div class="flex items-center gap-2 md:gap-3">
      <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-white text-base sm:text-lg shadow-lg">⚡</div>
      <div>
        <h1 class="text-xs sm:text-sm md:text-base font-black uppercase text-indigo-400 leading-tight" id="hdr-exam-title">ĐỀ ÔN THI HỌC SINH GIỎI</h1>
        <p class="text-[10px] sm:text-xs opacity-80 font-bold text-emerald-400" id="hdr-school-name">LỚP TOÁN 27 NGUYỄN ĐỨC CẢNH</p>
      </div>
    </div>

    <!-- BỘ ĐẾM THỜI GIAN -->
    <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl box-bg border border-amber-500/40 shadow">
      <i class="fa-solid fa-clock text-amber-500 animate-pulse text-xs sm:text-sm"></i>
      <span id="timer-display" class="font-mono text-xs sm:text-sm md:text-base font-black text-amber-500">90:00</span>
    </div>

    <!-- ACTION BUTTONS (ĐÃ MỞ NÚT FULLSCREEN CHO MOBILE) -->
    <div class="flex items-center gap-1.5 sm:gap-2">
      <button onclick="cycleTheme()" class="btn-touch px-2.5 sm:px-3 py-1 rounded-xl text-xs font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 flex items-center gap-1">
        <span id="theme-btn-label">🌙 Cyber</span>
      </button>
      <button onclick="toggleTocDrawer()" class="btn-touch px-2.5 sm:px-3 py-1 rounded-xl text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 flex items-center gap-1">
        <i class="fa-solid fa-list-check"></i> <span class="hidden sm:inline">Mục Lục</span>
      </button>
      <button onclick="toggleFullScreen()" title="Phóng to / Thu nhỏ toàn màn hình" class="btn-touch px-2.5 sm:px-3 py-1 rounded-xl text-xs font-bold glass-card text-indigo-300 flex items-center justify-center gap-1">
        <i class="fa-solid fa-expand text-sm"></i> <span class="hidden sm:inline">Toàn màn hình</span>
      </button>
      <button onclick="showScoreModal()" class="btn-touch px-2.5 sm:px-3 py-1 rounded-xl text-xs font-bold bg-amber-500/20 text-amber-500 border border-amber-500/40 flex items-center gap-1">
        <i class="fa-solid fa-trophy"></i> <span class="hidden sm:inline">Điểm</span>

    </div>
  </header>

  <!-- MÀN HÌNH CHÍNH TRÌNH CHIẾU -->
  <main class="flex-1 p-2 sm:p-3 md:p-4 flex flex-col relative overflow-hidden">
    <div class="glass-card rounded-2xl p-3 sm:p-4 md:p-5 flex-1 flex flex-col min-h-0 relative">
      
      <!-- THANH ĐIỀU HƯỚNG CÂU -->

        <div class="flex items-center gap-2">
          <span id="slide-num-badge" class="px-3.5 py-1 rounded-xl text-xs sm:text-sm font-black bg-indigo-600 text-white shadow-md">CÂU 1</span>

        </div>

        <div id="solution-box" class="hidden p-4 sm:p-5 rounded-2xl bg-amber-500/10 border-2 border-amber-500/40 text-sm md:text-base shadow-xl space-y-3">

      <div id="toc-grid" class="grid grid-cols-4 gap-2 flex-1 overflow-y-auto my-3 pr-1"></div>
    </div>
  </main>

  <!-- MODAL BẢNG ĐIỂM -->

    </div>
  </div>

n3\\)<\/span> đặt nằm ngang (cùng thuộc một hàng <span\nclass=\"math inline\">\\(i\\)<\/span>) có tổng các số là <span\nclass=\"math inline\">\\(3a_i \\ \\vdots \\ 3\\)<\/span>.<\/p><\/li>\n<li><p>Mỗi mảnh hình chữ nhật <span class=\"math inline\">\\(1 \\times\n3\\)<\/span> đặt thẳng đứng (phủ <span class=\"math inline\">\\(3\\)<\/span>\nhàng liên tiếp) có tổng các số là <span class=\"math inline\">\\(1 + 2 + 3\n= 6 \\ \\vdots \\ 3\\)<\/span>.<\/p><\/li>\n<li><p>Mỗi mảnh hình vuông <span class=\"math inline\">\\(2\\times\n2\\)<\/span> có tổng các số là <span class=\"math inline\">\\(1+1+2+2=6\\vdots\n3\\)<\/span>.<\/p><\/li>\n<\/ul>\n<p>Vậy tổng các số trong tất cả các mảnh hình chữ nhật <span\nclass=\"math inline\">\\(1 \\times 3\\)<\/span> và hình vuông <span\nclass=\"math inline\">\\(2\\times 2\\)<\/span> luôn luôn là một số chia hết\ncho <span class=\"math inline\">\\(3\\)<\/span>.<br />\nMặt khác, tổng tất cả các số trên toàn bộ bảng ô vuông <span\nclass=\"math inline\">\\(7 \\times 7\\)<\/span> là: <span\nclass=\"math display\">\\[\\begin{eqnarray*}\n                S = 7 \\cdot (1 + 2 + 3 + 1 + 2 + 3 + 1) = 7 \\cdot 13 =\n91.\n\\end{eqnarray*}\\]<\/span> Vì <span class=\"math inline\">\\(91\\)<\/span>\nkhông chia cho <span class=\"math inline\">\\(3\\)<\/span>, nên không phủ\nđược.<br />\n<strong>Chỉ ra một cách lát thỏa mãn:<\/strong><br />\nTa đặt mảnh vuông <span class=\"math inline\">\\(2 \\times 2\\)<\/span> phủ\n<span class=\"math inline\">\\(4\\)<\/span> ô ở giao của các hàng <span\nclass=\"math inline\">\\(2, 3\\)<\/span> với các cột <span\nclass=\"math inline\">\\(2, 3\\)<\/span> (hoàn toàn nằm bên trong bảng, không\nchạm biên), và dùng <span class=\"math inline\">\\(15\\)<\/span> mảnh hình\nchữ nhật <span class=\"math inline\">\\(1 \\times 3\\)<\/span> lát kín <span\nclass=\"math inline\">\\(45\\)<\/span> ô còn lại như hình tô màu minh họa\ndưới đây:<\/p>\n<div class=\"center\">\n<p><div class=\"tikz-container w-full flex justify-center my-2\">\n<sv )\"/>\n<path fill=\"none\" stroke-width=\"1.19553\" stroke-linecap=\"butt\" stroke-linejoin=\"miter\" stroke=\"rgb(75%, 0%, 0%)\" stroke-opacity=\"1\" stroke-miterlimit=\"10\" d=\"M 17.574686 70.298633 L 17.574686 105.448314 L 52.724367 105.448314 L 52.724367 70.298633 Z M 17.574686 70.298633 \" transform=\"matrix(0.993964, 0, 0, -0.993964, 6.53531, 128.815682)\"/>\n<path fill=\"none\" stroke-width=\"1.19553\" stroke-linecap=\"butt\" stroke-linejoin=\"miter\" stroke=\"rgb(0%, 0%, 0%)\" stroke-opacity=\"1\" stroke-miterlimit=\"10\" d=\"M -0.00015472 -0.000728502 L -0.00015472 123.023155 L 123.023729 123.023155 L 123.023729 -0.000728502 Z M -0.00015472 -0.000728502 \" transform=\"matrix(0.993964, 0, 0, -0.993964, 6.53531, 128.815682)\"/>\n<g fill=\"rgb(75%, 0%, 0%)\" fill-opacity=\"1\">\n<use xlink:href=\"#glyph-0-0\" x=\"31.476836\" y=\"43.612137\"/>\n<\/g>\n<g fill=\"rgb(75%, 0%, 0%)\" fill-opacity=\"1\">\n<use xlink:href=\"#glyph-1-0\" x=\"38.198643\" y=\"43.612137\"/>\n<\/g>\n<g fill=\"rgb(75%, 0%, 0%)\" fill-opacity=\"1\">\n<use xlink:href=\"#glyph-0-0\" x=\"46.614964\" y=\"43.612137\"/>\n<\/g>\n<\/svg>\n<\/div><\/p>\n<\/div>"}];
    const IS_STUDENT = false;
    const LOCK_SOLUTION = false;
    let timerSeconds = 5400;
    let timerRunning = false;

    let currentIndex = 0;
    let userAnswers = {};
    let showSol = false;
    let studentData = { name: "", studentClass: "", sbd: "" };
    let currentThemeIndex = 0;
    const themes = ["cyber", "aurora", "pearl"];
    const themeLabels = ["🌙 Cyber", "🔮 Aurora", "☀️ Ngọc Trai"];

    function cycleTheme() {
      currentThemeIndex = (currentThemeIndex + 1) % 3;
      document.body.setAttribute('data-theme', themes[currentThemeIndex]);
      document.getElementById('theme-btn-label').innerText = themeLabels[currentThemeIndex];
    }

    function renderMath() {
      setTimeout(() => {
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch((err) => console.log(err));
        }
      }, 50);
    }

    setInterval(() => {
      if (timerRunning && timerSeconds > 0) {
        timerSeconds--;
        const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
        const s = (timerSeconds % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = m + ":" + s;
      }
    }, 1000);

    function startExamSession() {
      const nameInp = document.getElementById('input-student-name');
      const classInp = document.getElementById('input-student-class');
      const sbdInp = document.getElementById('input-student-sbd');

      studentData.name = nameInp ? nameInp.value.trim() : "";
      studentData.studentClass = classInp ? classInp.value.trim() : "";
      studentData.sbd = sbdInp ? sbdInp.value.trim() : "";

      timerRunning = true;
      if (SLIDES.length > 1) {
        currentIndex = 1;
        renderSlide();
      }
    }

    function updateTocGrid() {
      const grid = document.getElementById('toc-grid');
      grid.innerHTML = '';
      SLIDES.forEach((s, idx) => {
        const btn = document.createElement('button');
        let bgClass = "box-bg border";
        if (s.isCoverSlide) {
          bgClass = "bg-indigo-600/30 border-indigo-500 font-black text-indigo-300";
        } else if (userAnswers[s.id] !== undefined) {
          bgClass = "bg-emerald-600 text-white font-black border-emerald-500 shadow-md";
        }
        if (idx === currentIndex) bgClass += " ring-4 ring-indigo-500 border-indigo-500";

        btn.className = `btn-touch p-2.5 rounded-xl text-xs sm:text-sm font-bold flex flex-col items-center justify-center transition-all ${bgClass}`;
        btn.innerHTML = `<span>${s.title}</span>`;
        btn.onclick = () => { currentIndex = idx; showSol = false; renderSlide(); toggleTocDrawer(); };
        grid.appendChild(btn);
      });
    }

    function renderSlide() {
      if (SLIDES.length === 0) return;
      const s = SLIDES[currentIndex];

      document.getElementById('slide-num-badge').innerText = s.title.toUpperCase();
      document.getElementById('slide-question').innerHTML = s.question;
      document.getElementById('slide-solution').innerHTML = s.solution || "Chưa có lời giải chi tiết.";
      document.getElementById('progress-indicator').innerText = (currentIndex) + " / " + (SLIDES.length - 1);

      const colInter = document.getElementById('col-interactive');
      const footerSol = document.getElementById('footer-sol-bar');

      if (s.isCoverSlide) {
        colInter.classList.add('hidden');
        footerSol.classList.add('hidden');
        document.getElementById('slide-type-badge').innerText = "Trang bìa & Thông tin";
        document.getElementById('progress-indicator').innerText = "Trang Bìa";
      } else if (s.isTheorySlide) {
        colInter.classList.add('hidden');
        footerSol.classList.add('hidden');
        document.getElementById('slide-type-badge').innerText = "Tóm tắt lý thuyết / Dạng toán";
      } else {
        colInter.classList.remove('hidden');
        footerSol.classList.remove('hidden');
        document.getElementById('slide-type-badge').innerText = s.type === 'MCQ' ? 'Trắc nghiệm 4 lựa chọn' : (s.type === 'TF' ? 'Đúng / Sai' : 'Tự luận / Đáp số');

        const area = document.getElementById('interactive-area');
        area.innerHTML = '';

        /* ========== 1. TRẮC NGHIỆM 4 PHƯƠNG ÁN (\choice) ========== */
        if (s.type === 'MCQ') {
          const gridBox = document.createElement('div');
          gridBox.className = "grid grid-cols-1 md:grid-cols-2 gap-3";

          (s.options || []).forEach((opt, idx) => {
            const btn = document.createElement('button');
            const isSel = userAnswers[s.id] === idx;
            const isCorrect = idx === s.correctIndex;

            let styleClass = "w-full text-left p-4 rounded-2xl border text-sm sm:text-base font-semibold transition-all flex items-center justify-between btn-touch shadow-sm ";

            if (showSol) {
              if (isCorrect) {
                styleClass += "bg-emerald-600/40 border-2 border-emerald-400 font-black text-emerald-200 ring-4 ring-emerald-500/50 shadow-lg scale-[1.01]";
              } else if (isSel) {
                styleClass += "bg-rose-600/40 border-2 border-rose-400 font-black text-rose-200 ring-4 ring-rose-500/50";
              } else {
                styleClass += "box-bg opacity-50";
              }
            } else {
              if (isSel) {
                styleClass += "bg-indigo-600/40 border-2 border-indigo-500 font-extrabold text-indigo-200 ring-4 ring-indigo-500/30 shadow-md";
              } else {
                styleClass += "box-bg hover:border-indigo-500/60";
              }
            }

            let badgeHtml = "";
            if (showSol) {
              if (isCorrect) badgeHtml = '<span class="text-xs px-3 py-1.5 rounded-xl bg-emerald-500 text-white font-black shadow-md ml-2 shrink-0 flex items-center gap-1"><i class="fa-solid fa-check"></i> ĐÁP ÁN ĐÚNG</span>';
              else if (isSel) badgeHtml = '<span class="text-xs px-3 py-1.5 rounded-xl bg-rose-500 text-white font-black shadow-md ml-2 shrink-0 flex items-center gap-1"><i class="fa-solid fa-xmark"></i> BẠN CHỌN</span>';
            }

            btn.className = styleClass;
            btn.innerHTML = `<div class="flex-1 leading-relaxed">${opt}</div>${badgeHtml}`;
            btn.onclick = () => { if (!showSol) { userAnswers[s.id] = idx; renderSlide(); updateTocGrid(); } };
            gridBox.appendChild(btn);
          });
          area.appendChild(gridBox);
        } 
        /* ========== 2. TRẮC NGHIỆM ĐÚNG / SAI (\choiceTF) ========== */
        else if (s.type === 'TF') {
          if (!userAnswers[s.id]) userAnswers[s.id] = {};
          (s.tfItems || []).forEach((item, idx) => {
            const row = document.createElement('div');
            row.className = "w-full p-4 rounded-2xl box-bg border flex flex-col md:flex-row justify-between items-start md:items-center text-sm md:text-base gap-3 shadow-md";
            const ans = userAnswers[s.id][idx];

            let trueStyle = "box-bg text-slate-300 border border-slate-700/60 hover:border-indigo-500/60";
            let falseStyle = "box-bg text-slate-300 border border-slate-700/60 hover:border-indigo-500/60";

            if (showSol) {
              if (item.correct === true) {
                trueStyle = "bg-emerald-600 text-white font-black border-2 border-emerald-300 ring-4 ring-emerald-500/50 shadow-xl scale-105";
                falseStyle = (ans === false) ? "bg-rose-600 text-white font-black border-2 border-rose-300 ring-4 ring-rose-500/50 shadow-xl" : "box-bg opacity-40 border border-slate-800";
              } else {
                falseStyle = "bg-emerald-600 text-white font-black border-2 border-emerald-300 ring-4 ring-emerald-500/50 shadow-xl scale-105";
                trueStyle = (ans === true) ? "bg-rose-600 text-white font-black border-2 border-rose-300 ring-4 ring-rose-500/50 shadow-xl" : "box-bg opacity-40 border border-slate-800";
              }
            } else {
              if (ans === true) trueStyle = "bg-indigo-600 text-white font-black border-2 border-indigo-400 ring-2 ring-indigo-500/40 shadow-md";
              if (ans === false) falseStyle = "bg-indigo-600 text-white font-black border-2 border-indigo-400 ring-2 ring-indigo-500/40 shadow-md";
            }

            let trueBadge = (showSol && item.correct === true) ? ' <i class="fa-solid fa-check ml-1.5 text-white"></i>' : '';
            let falseBadge = (showSol && item.correct === false) ? ' <i class="fa-solid fa-check ml-1.5 text-white"></i>' : '';
            
            if (showSol) {
              if (ans === true && item.correct === false) trueBadge = ' <i class="fa-solid fa-xmark ml-1.5 text-rose-200"></i>';
              if (ans === false && item.correct === true) falseBadge = ' <i class="fa-solid fa-xmark ml-1.5 text-rose-200"></i>';
            }

            row.innerHTML = `
              <div class="flex-1 leading-relaxed font-semibold pr-2"><b class="text-indigo-400 text-base md:text-lg mr-1.5">${item.label})</b> ${item.statement}</div>
              <div class="flex gap-3 shrink-0 w-full md:w-auto justify-end min-w-[200px]">
                <button onclick="setTF(${s.id}, ${idx}, true)" class="btn-touch flex-1 md:flex-initial px-5 py-2.5 rounded-xl text-sm md:text-base transition-all flex items-center justify-center font-black ${trueStyle}">
                  <span>Đúng</span>${trueBadge}
                </button>
                <button onclick="setTF(${s.id}, ${idx}, false)" class="btn-touch flex-1 md:flex-initial px-5 py-2.5 rounded-xl text-sm md:text-base transition-all flex items-center justify-center font-black ${falseStyle}">
                  <span>Sai</span>${falseBadge}
                </button>
              </div>
            `;
            area.appendChild(row);
          });
        } 
        /* ========== 3. TRẢ LỜI NGẮN (\shortans / \SA) ========== */
        else if (s.type === 'SA') {
          if (!userAnswers[s.id] || typeof userAnswers[s.id] !== 'object') userAnswers[s.id] = {};
          const userVal = userAnswers[s.id][0] || "";

          const wrap = document.createElement('div');
          wrap.className = "space-y-3";
          wrap.innerHTML = `
            <input type="text" placeholder="Nhập đáp số..." 
              class="w-full p-4 rounded-2xl box-bg border-2 border-indigo-500/40 text-base md:text-lg font-black text-amber-400 focus:outline-none focus:border-indigo-400 shadow-inner"
              value="${userVal.replace(/"/g, '&quot;')}"
              oninput="userAnswers[${s.id}][0] = this.value; updateTocGrid();"
            />
          `;
          if (showSol) {
            wrap.innerHTML += `
              <div class="p-4 rounded-2xl bg-emerald-500/20 border-2 border-emerald-500/50 text-emerald-300 text-sm md:text-base font-bold flex items-center gap-2.5 shadow-lg">
                <i class="fa-solid fa-circle-check text-lg text-emerald-400"></i>
                <span>Đáp số chuẩn: <b class="text-emerald-200 text-base md:text-lg ml-1">${s.correctAnswer}</b></span>
              </div>
            `;
          }
          area.appendChild(wrap);
        } 
        /* ========== 4. TỰ LUẬN (\bt) ========== */
        else {
          const essayList = s.essayItems && s.essayItems.length > 0 ? s.essayItems : [{label: 'Đáp số / Kết quả', text: ''}];
          if (!userAnswers[s.id] || typeof userAnswers[s.id] !== 'object') userAnswers[s.id] = {};

          essayList.forEach((item, idx) => {
            const wrap = document.createElement('div');
            wrap.className = "mb-3 space-y-1.5";
            wrap.innerHTML = `
              <div class="text-sm font-bold text-indigo-300">${item.label}:</div>
              <input type="text" placeholder="Nhập kết quả cho ${item.label}..."
                class="w-full p-4 rounded-2xl box-bg border-2 border-indigo-500/40 text-base md:text-lg font-black text-amber-400 focus:outline-none focus:border-indigo-400 shadow-inner"
                value="${(userAnswers[s.id][idx] || "").replace(/"/g, '&quot;')}"
                oninput="userAnswers[${s.id}][${idx}] = this.value; updateTocGrid();"
              />
            `;
            area.appendChild(wrap);
          });
        }
      }

      const solBox = document.getElementById('solution-box');
      const btnSol = document.getElementById('btn-sol-toggle');
      if (showSol) {
        solBox.classList.remove('hidden');
        btnSol.innerHTML = '<i class="fa-solid fa-eye-slash mr-1.5"></i> Ẩn Lời giải';
      } else {
        solBox.classList.add('hidden');
        btnSol.innerHTML = '<i class="fa-solid fa-lock mr-1.5"></i> Xem Lời giải';
      }

      // Tự động cuộn khung nội dung về đầu khi chuyển câu mới
      const mainScroll = document.getElementById('main-content-scroll');
      if (mainScroll) mainScroll.scrollTop = 0;

      updateTocGrid();
      renderMath();
    }

    function setTF(sid, idx, val) {
      if (showSol) return;
      if (!userAnswers[sid]) userAnswers[sid] = {};
      userAnswers[sid][idx] = val;
      renderSlide();
    }

    function nextSlide() { if (currentIndex < SLIDES.length - 1) { currentIndex++; showSol = false; renderSlide(); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; showSol = false; renderSlide(); } }

    function toggleTocDrawer() {
      document.getElementById('toc-drawer').classList.toggle('translate-x-[110%]');
    }

    function calculateScore() {
      let earned = 0, total = 0;
      SLIDES.forEach(s => {
        if (s.isTheorySlide || s.isCoverSlide) return;
        total += 1;
        const ans = userAnswers[s.id];
        if (s.type === 'MCQ' && ans === s.correctIndex) earned += 1;
        else if (s.type === 'SA' && ans && ans[0] && ans[0].trim().toLowerCase() === (s.correctAnswer||'').trim().toLowerCase()) earned += 1;
        else if (s.type === 'TF' && ans) {
          let itemPts = 0;
          (s.tfItems||[]).forEach((item, i) => { if (ans[i] === item.correct) itemPts += 0.25; });
          earned += itemPts;
        }
      });
      return total > 0 ? (earned / total) * 10 : 0;
    }

    function toggleSolution() {
      if (IS_STUDENT && LOCK_SOLUTION && !showSol) {
        const score = calculateScore();
        if (score < 3.0) {
          alert("🔒 LỜI GIẢI ĐÃ BỊ KHÓA! Bạn cần đạt tối thiểu 3.0 điểm để mở xem Lời giải chi tiết. (Điểm hiện tại: " + score.toFixed(1) + "/10)");
          return;
        }
      }
      showSol = !showSol;
      renderSlide();

      if (showSol) {
        setTimeout(() => {
          const solBox = document.getElementById('solution-box');
          if (solBox) solBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 150);
      }
    }

    function showScoreModal() {
      const score = calculateScore();
      document.getElementById('score-val').innerText = score.toFixed(1);
      
      const infoBox = document.getElementById('score-student-info');
      if (studentData.name || studentData.studentClass) {
        infoBox.innerHTML = `Thí sinh: <b>${studentData.name || 'Chưa nhập'}</b> - Lớp: <b>${studentData.studentClass || 'Chưa nhập'}</b> - SBD: <b>${studentData.sbd || 'N/A'}</b>`;
      } else {
        infoBox.innerHTML = `Thí sinh tự do (Chưa nhập tên trên Trang Bìa)`;
      }

      document.getElementById('score-msg').innerText = score < 3.0 && LOCK_SOLUTION ? 
        "⚠️ Điểm số dưới 3.0. Hệ thống đã khóa Lời giải chi tiết để bạn rèn luyện lại." : "🎉 Bạn đã hoàn thành bài thi!";
      document.getElementById('modal-score').classList.remove('hidden');
    }

    function toggleFullScreen() {
      const doc = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (doc.requestFullscreen) doc.requestFullscreen();
        else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    /* ========== BỘ ĐIỀU HƯỚNG BÀN PHÍM LAPTOP (KEYBOARD SHORTCUTS) ========== */
    document.addEventListener('keydown', function(e) {
      // Bỏ qua phím tắt nếu học sinh đang gõ chữ vào các ô nhập liệu input / textarea
      const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      if (activeTag === 'input' || activeTag === 'textarea') return;

      const scrollContainer = document.getElementById('main-content-scroll');

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (scrollContainer) scrollContainer.scrollTop -= 100;
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (scrollContainer) scrollContainer.scrollTop += 100;
      }
    });

    if (EXAM_INFO.examName) document.getElementById('hdr-exam-title').innerText = EXAM_INFO.examName;
    if (EXAM_INFO.school) document.getElementById('hdr-school-name').innerText = EXAM_INFO.school;
    renderSlide();
  </script>
</body>
</html>
